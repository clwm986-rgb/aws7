<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>연습예제</title>
	<style>
		a{
			/* 글자색 검정, 밑줄 제거 */
			text-decoration: none; 
			color: black;
		}
		a:hover{
			/* 밑줄 추가 */
			text-decoration: underline;
		}
		a:visited{
			/* 글자두께 두껍게 */
			font-weight: bold;
			color: red;
		}

	</style>

</head>
<body>
	<!-- 
	a태그의 글자색을 검정으로 바꾸고 밑줄 지우기
	a태그를 hover하면 글자에 밑줄 생기게하기 
	해당링크를 방문하면 글자가 빨간색 되도록 바꾸기
	-->
	<a href="//naver.com">네이버로 이동</a>
	</div>
	
</body>
</html>
