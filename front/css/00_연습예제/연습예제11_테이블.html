<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>테이블 예제</title>
	<style>
/* < 전체 테두리 > */
	/* border : 1px solid min; */
	/* 위 태두리 : 1px solid mint; */
	/* <방법1> 
			* 위 테두리 : 1px solid mint;
			* 아래 테두리 : 1px solid mint;
				-> border-top: 1px solid aqua;
 			 		border-bottom: 1px solid aqua; */

	/* <방법2>
			* 전체 테두리 : 1px solid mint;
			* 왼쪽테두리 : none;
			* 오른쪽 쪽테두리 : none;
				-> boder:1px solid mint;
				border-left-style: none; 
				border-right-style: none; 
				border-style : solid mint;
			*/
			
	/* <방법3> 
			* 전체 테두리 지정
			* 왼쪽 테두리 두께 : 0
			* 오른쪽 테두리 두께 : 0
				-> border : 1px solid mint;
					border-width : 1px 0; */

  /* border-left: none;
  border-right: none; */
table.table-empty {
  border-collapse: collapse; width: 100%;
	
}
th, td {
	border-style: solid none;
}
tbody > tr:hover{
	background-color: blanchedalmond;
}
</style>
</head>
<body>
	<h2>테이블 연습 문제</h2>
	<table class="table table-empty">
		<thead>
			<tr>
				<th>번호</th>
				<th>제목</th>
				<th>작성자</th>
				<th>조회수</th>
			</tr>
		</thead>
		<tbody>
			<tr>
				<td>2</td>
				<td style="text-decoration: underline color blue;">게시글 입니다.</td>
				<td>관리자</td>
				<td>10</td>

			<tr>
				<td>1</td>
				<td style="text-decoration: underline color blue;">공지사항 필독!</td>
				<td>관리자</td>
				<td>100</td>
			</tr>
			</tr>
	</table>
</body>
</html>
