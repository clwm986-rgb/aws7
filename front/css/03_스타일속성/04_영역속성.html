<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>영역 속성 예제</title>
		<!-- 
	요소의 구성 : 마진(border밖 위치 지정, 콘텐츠 크기 상관ㄴㄴ) + '테두리 + 패딩 + 컨텐츠' 만 
	*box-sizing
		- widght/height의 기준을 정하는 속성
		- 값
		 * border-box : 테두리 + 패딩 + 콘텐츠 = 너비/높이 
		 * content-box : 컨텐츠 = 너비/높이 

	* width / height p.111
		- 요소의 너비/높이로, box-siaing에 따라 기준이 달라짐
		 -width가 100px 
		 	-> border-box인 경우 : 테두리 + 패딩 +컨테츠 = 100px 테두리가 두꺼웢면 컨텐츠가 줄어듬
			=> left 테두리 10px, rigth 테두리 10ㅔㅌ, 왼패딩 10px/오 패딩10px = 컨텐츠 60px
				=> 너비는 여전히 100px, 패딩은 고정 각 테두기 5px증가
				=> 컨텐츠가 50px줄어듬 

		content-box 인 경우 : 
		left 테두리 10px, rigth 테두리 10ㅔㅌ, 왼패딩 10px/오 패딩10px = 컨텐츠 60px
		너비는 여전히 100px, 패딩은 고정 각 테두기 5px증가
		컨텐츠는 그대로 100px
		요소의 너비 -> 왼테15 오테 15 왼패10 오패 10 컨텐츠 100
			=> 총요소는 150
	* margin p.155
		- 요소의 테두리 밖 여백 지정
		- margin-top / margin- right / margin-bottom / margin- left
		- margin
			-> 단축 속성, 상우하좌 (순서임)마진 한번에 쓴 속성
			ex) margin : 10 20 30 40 (px)
			-> 상 10 우 20 하 30 좌40 (px)
			margin : 10 20 30 ''
			-> 상 10 우 20 하 30 좌 20''
			margin : 10 20
			-> 상하10 좌우20
			margin 10
			-> 네변 10
			margin : 0 auto
			-> wid가 고정px일때 부모 요소 가운데 배치

	* padding p.118
		- 요소안 여백을 지정
		- 사용방식은 margin과 동일 
		- 테두리를 기준으로 컨탠츠에 시작 위치 지정때 사용
	
	* 테두리 p.121

		border-width
	- 테두리 두께
	- 단축 속성 : border-위치-width를 합침. 위치에는 top, right, bottom, left

	border-style
	- 테두리 종류
	- 단축 속성 : border-위치-style를 합침. 위치에는 top, right, bottom, left
	- 값 : solid(실선), dashed, dotted, none, double, ridge, inset, outset 등
	  - solid : 실선, none : 테두리를 없앰(테두리 두께 적용 X)

	border-color
	- 테두리 색상
	- 단축 속성 : border-위치-color를 합침. 위치에는 top, right, bottom, left

	border
	- border-style, border-width, border-color가 모두 적용되는 속성
	- border-위치를 합친 속성

	border-radius
	- 둥근 모서리 테두리를 지정
	- border-위치1-위치2-radious를 줄여쓴 단축 속성
	  - 위치1 : top, bottom, 위치2 : left, right

	-->
		<style>
			.box1{ 
				width: 200px; height: 200px; padding: 20px; border: 20px solid black;
				margin-top: 20px;
			}
			.border-box{box-sizing: border-box;}
			.content-box{box-sizing: content-box; }
			.m2{margin-left: 50px;}
			.m3{margin: 40px 100px;}
			.m4{margin: 0 auto;}
			
			.container3 > .box1{ padding : 0}

			.container3 > .p1{ padding-left: 200px;}
			.container3 > .p2{ padding: 50px 150px;}	
			.container3 > .p3{ padding: 50px;}	

			.b1{ border-width: 1px 10px; }
			.b2{ border-style: dotted double dashed none;}
			.b3{ border-color: red blue green yellow;}
			.b4{ border-top: none; border-right: 0;}
			.b5{ border: 3px solid red; border-radius: 50%;}
		</style>
</head>
<body>
	<div class="container1">
		<h1>box-sizing 예제</h1>
		<div class="box1 border-box">border-box</div>
		<div class="box1 content-box">content-box</div>
	</div>

	<div class="container2">
		<h1>margin 예제</h1>
		<div class="box1 m1"></div>
		<div class="box1 m2"></div>
		<div class="box1 m3"></div>
		<div class="box1 m4"></div>
	</div>

	<div class="container3">
		<h1>padding 예제</h1>
		<div class="box1"></div>
		<div class="box1 p1"></div>
		<div class="box1 p2"></div>
		<div class="box1 p3"></div>
	</div>
	
	<div class="container4">
		<h1>테두리 예제</h1>
		<div class="box1 b1"></div>
		<div class="box1 b2"></div>
		<div class="box1 b3"></div>
		<div class="box1 b4"></div>
		<div class="box1 b5"></div>
	</div>
</body>
</html>
