<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>기본선택자</title>
	<!--
	선택자
	- 요소(태그)를 선택하는 방법

	선택자를 이용한 스타일 적용 방법
	
A. 선택자{
		속성 : 값;
		속성 : 값;
	}

B. 선택자{속성:값;속성:값}

	1. 전채 선택자 p.72
		* : 모든 태그를 선택
			: 우선 순위 -> 0 

	2. 태그 선택자 P.74
		- 태그 
		- 해당 태그들을 모두 선택
		- 우선순위: 1

	3. 클래스 CLASS 선택자 P.86
		- .클래스
		- 태그의 CALSS 속성의 값이 잂치하는 요소를 선택
		- clASS 속성은 기능은 없은. 스타일을 적용할 때 사용

	4. 아이디 선택자 P.87
	- #아이디
	-- ID 속성의 값이 일치하는 요소를 선택
	- 우선순위 : 100

	선택자{
	속성 : 값 !importent;
	}
	- !importent : 우선순위를 무시하고 무조건 적용. 자주 사용 ㄴㄴ
	-->
	<style>
		*{ color: blue;}
		div{font-size: 30px; color: brown;}
		.bg-yello{background: yellow;}
		#hi{font-weight: bold; color: pink;}
	</style>
</head>
<body>

	<div>안녕</div>
	<div class="bg-yello">안녕</div>
	<p>안녕</p>
<span>안녕</span>
<div id="hi">안녕</div>
<a href="#" class="bg-yello">안녕</a>

</body>
</html>
