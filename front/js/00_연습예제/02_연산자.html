<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>연산자 예제</title>
</head>
<body>
<script>
		// prompt를 이용하여 두 정수를 입력받아 두 정수의 합을 alert으로 출력
		// prompt를 이용하여 입력을 박으면 값에 상관없이 타입이 문자열이다
  let num1 = prompt("첫 번째 정수를 입력하세요:");
  let num2 = prompt("두 번째 정수를 입력하세요:");
	let result = parseInt(num1) + parseInt(num2);
	alert(`${num1} + ${num2} = ${result}`);
	//alert(`${num1} + ${num2} = ${Number(num1) + Number(num2)}`);
	//${num1} + ${num2} 이거는 문자열로 인식하기에 이어붙이기 된다.
	// 그래서 Number를 앞에다가 넣어야한다.
</script>
</body>
</html>
