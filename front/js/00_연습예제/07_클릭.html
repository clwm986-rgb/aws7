<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>클릭 예제</title>
</head>
<body>
	<!-- 
	다음 버튼을 클릭해서 alert창이 뜨도록 구현
	-->
	<button onclick='alert("버튼")'>버튼</button>

	<script>
		const btn = document.querySelector('button') //이 선택자를 선택
		const btn1 = document.querySelectorAll('button')[0]; // 이 선택자 모두를 선택
		

		btn.addEventListener('click', function(){//<- 이 순서 기억 이벤트명, 함수()
			alert("클릭")
		});
	</script>
</body>
</html>
