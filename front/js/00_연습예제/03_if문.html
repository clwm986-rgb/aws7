<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>if문</title>
</head>
<body>
	<script>
		/*
		숫자가 0보다 크면 양수라고 출력
		숫자가 0보다 작으면 음수라고 출력
		숫자가 0이면 0이라고 출력

		*/ 
		// let 숫자 = -1;
		/* 
		아래 예제를 if3개로 구현하면 무조건 3번 비교를 함
		아래 예제를 if else로 구현되어 있기 때문에 최소 1번, 최대 2번 비교를 함
		*/ 
		let 숫자 = 12;
		if(숫자 > 0){
			document.write(`${숫자}은 양수 <br>`);
		}else if(숫자 < 0){
			document.write(`${숫자}은 음수 <br>`);
		}else{
			document.write(`${숫자} <br>`);
			}
			// 다른방법 : 조건식이 간단하지만 순서가 중요하다
			let 성적 = 80;
			if(성적 < 0 || 성적 > 100){
				document.write(성적 + '점은 잘못된 성적 <br>');
			}
				else if(성적 >= 90 ){
					document.write(성적 + '점은 A학점 <br>');
				}else if(성적 >= 80 ){
					document.write(성적 + '점은 B학점 <br>');
				}else if(성적 >= 70){
					document.write(성적 + '점은 C학점 <br>');
				}else if(성적 >= 60 ){
					document.write(성적 + '점은 D학점 <br>');
				}else if(성적 >= 0 ){
					document.write(성적 + '점은 F학점 <br>');
				}else{
					document.write(성적 + '점은 잘못된 성적 <br>');
				}
				/*
				숫자가 홀수인지 짝수인지 판별하는 코드 작성
				숫자를 2로 나눳을때 나머지 0과 같다
				*/ 
				if (숫자 % 2 == 0) {
   				document.write(`${숫자}는 짝수 <br>`);
				} else {
    			document.write(`${숫자}는 홀수 <br>`);
				}
				/*
				숫자가 2의 배수, 3의 배수, 6의 배수인지 판펼
				*/ 
				숫자 = 6;
				if (숫자 % 2 === 0 && 숫자 % 3 !=0) {
    			document.write(숫자 + '는 2의 배수 <br>');
				} else if (숫자 % 3 === 0 && 숫자 % 2 !=0) {
    			document.write(`${숫자}는 3의 배수 <br>`);
				} else if (숫자 % 6 === 0 ) { // 6의배수를 맨 위로 올리면 됨 
    			document.write(`${숫자}는 6의 배수 <br>`);
				}else{
					document.write(`${숫자}은 2, 3, 6의 배수가 아님 <br>`);
				}

				/* 
				< if문 안에 if문이 들어가는 형태 >
				if(조건식){
					if(조건식2){
						실행문;
					}else{
						실행문2
					}
				}
				- > 위 중첩 if문을 일반 if문으로 변경
					if(조건식 && 조건식2){
						실행문1;
					}else if(조건식){
						실행문2;
					}
				*/ 

			// 중첩 if문 적용
				if (숫자 % 2 === 0 ) {
					if(숫자 % 3 ==0){
						document.write(`${숫자}는 6의 배수 <br>`);
					}else
    			document.write(숫자 + '는 2의 배수 <br>');
				} 
				else if (숫자 % 3 === 0 ) {
    			document.write(`${숫자}는 3의 배수 <br>`);
				} 
				else{
					document.write(`${숫자}은 2, 3, 6의 배수가 아님 <br>`);
				}
	</script>
</body>
</html>
