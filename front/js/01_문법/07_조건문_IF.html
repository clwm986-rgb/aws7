<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>조건문</title>
</head>
<body>
	<script>
		/*
		< 조건문 >
			- 상황에 따라 결과가 달라질 때 사용
			- ex) 음료수 자판기 -> 누른 메누에 따라 나오는 음료 달라짐
			- 말로 표현 했을 때 ~이면 ~해라라고 펴현되며 조건문 사용
			- 성적이90이상 100이하면 학점은 A로 출력
			- 면허증을 가져왓거나 민증을 가져왓거나 여권을 가져왓으면 토익을 응시해도 된다.

		* if
			- 모든 조건문은 if문으로 표현 가능
			- 문법
				if (조건식){
						실행문;
					}
				- 문법 설명
					* 조건식 : 결과가 참 or 거짓이 되는 식
					- 하지만 js에서는 결과가 true/false 가 아니어도 동작함
				- 문법 적용	
					- A이면 B해라 -> 조건문 사용 가능
					if(A){
						B;
					}
					- 성적을 조건문에 적용
					if(성적이 90이상 100이하){
						학점을 A로 출력해라	
						}
					- 토익을 조건문에 적용
						if(면허증 or 민증 or 여권이 있다){
						토익 응시 해라	
						}
				*/ 
				
				if(면허증 || 민증이 || 여권이){
					document.write('토익 응시 가능<br>');
				}
				//면허증 ㄴㄴ 민증ㄴㄴ 여권ㄴㄴ면 토익 응시 ㄴㄴ 
				if(!면허증 && !민증 && !여권){
					document.write('토익 응시 불가능<br>');
				}
				//면허증 if문을 참고해서 if문으로 구현
				let 성적=90;
				if(성적 >= 90 && 성적 <= 100){
					document.write('A학점 <br>');
				}

			/*
			if else문
			- A히면 해라 아니면 C해라
			- 모 아니면 도일 때
			- 신분증이 있으면 토익응시 가능하고, 아니면 토익 응시 불가능
			- if문 2개 쓸걸 하나로 줄임 -> 조건식을 하나 덜씀
			< 문법 >
			if(조건식){
				실행문1
			}
			else{
				실행문2
			}
			*/ 
			
			if(면허증 || 민증이 || 여권이){
					document.write('토익 응시 가능<br>');
				}
				 //if(!면허증 && !민증 && !여권)
				else{
					document.write('토익 응시 불가능<br>');
				}
				/*
				if else if문
				- 조건이 3개 이상일 때
				- 조건이 2개인데 둘 중 하나가 아닐 때
				< 문법 >
				if(조건식1){ // 조건식1이 참이면 실행문1을 실행하고
				실행문1;
				}
				else if(조건식2){	// 위의 조건식이 거짓이고(조건식1이 거짓이고) 조건식2가 참이면 실행문2을 실행
				실행문2;
				}
				// 위의 조건식이 거짓이고(조건식1과 조건식2가 거짓이고) 조건식3이 참이면 실행문3을 실행
				...
				// 위의 조건식이 거짓이면(조건식과 조건식2와 ...가 거짓이면) 실행문을 실행
				else{
				실행문;
				}
				*/ 
				/*
				성적이 90이상 100이하면 A출력
				성적이 80이상 90이하면 B출력
				성적이 70이상 80이하면 C출력
				성적이 60이상 70이하면 D출력
				성적이 0이상 60이하면 F출력
				아니면 잘못된 성적이라고 출력.
				*/ 
				성적 = 150;
				if(성적 >= 90 && 성적 <= 100){
					document.write(성적 + '점은 A학점 <br>');
				}else if(성적 >= 80 && 성적 <= 90){
					document.write(성적 + '점은 B학점 <br>');
				}else if(성적 >= 70 && 성적 <= 80){
					document.write(성적 + '점은 C학점 <br>');
				}else if(성적 >= 60 && 성적 <= 70){
					document.write(성적 + '점은 D학점 <br>');
				}else if(성적 >= 0 && 성적 <= 60){
					document.write(성적 + '점은 F학점 <br>');
				}else{
					document.write(성적 + '점은 잘못된 성적 <br>');
				}

				성적 = 90;
				// 아래 코드는 대입연산자를 써서 기존 성적과 상관없이 무조건 100이 들어가고,
				// 100은 거짓 (0,flese, '', NaN 등)이 아니기 때문에 참으로 실행
				// 100점이 만점이라 실행되는게 아니라 100이 거짓이 아니기 때문에 실행
				if (성적 = 100){
					document.write('만점 입니다. <br>');
				}

	</script>
</body>
</html>
