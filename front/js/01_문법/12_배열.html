<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>배열</title>
</head>
<body>
	<script>
		/*
	앞에서 선택한 요소들을 활용하려면 배열을 알아야함
	< 배열 >
		- 여러개 정보를 묶어서 관리할 때 사용
		- 반복문과 함께 사용
		- 배열 자체에서 기능을 제공

	배열 선언 방밥
	let 변수명 = []; //빈 배열 생성
	let 변수명 = [값1, 값2, ...] //초기값이 잇는 걍우 배열 생성	
	let 변수명 = new Array(size); //배열 크기가size인 배열 생성
	let 변수명 = new Array(값1, 값2, ...); //초기값이 잇는 배열 생성

	배열 사용 방법
	- 번지 : 위치로 0부터 시작, 3개짜리 배열ㅇㄴ 0번지 부터 시작해서 2번지까지 잇음
	1. 배열값 수정
	변수명[번지] = 값;
	2. 배열값 가져오기
	변수명[번지]
		*/
	let arr = [1, 2, 3];
	arr [1] = 4;
	console.log(arr);
	console.log(arr[0]);//0번지(처음값)에 잇는 값을 가져옴

	// 반복문으로 배열에 잇는 값을 확인해서 브라우저에 출력
	// i<=2 와 i<3가 결과가 같음, 그런데 배열의 개수가 3개이어서 3이 들어간 식으로 표현
	arr.push('push')
	arr.unshift('unshift')
	for(i = 0; i <=2; ++i){
		document.write(`${arr[i]}<br>`);
	}
	/*
	< 배열에서 제공하는 기능 >
	1. 변수. length
		- 배열의 크기를 반환
		
	2. 배열의 값 추가
		* 변수.push(값)
			- 배열 '끝'에 값을 추가
		* 변수 unshift(값)
			- 배열 '앞'에 값을 추가

	3. 배열 값 삭제
		* 변수.pop()
			- 배열 끝에 값을 삭제 후 반환
		* 변수.shift()
			- 배열 앞에 값을 삭제 후 반환

	4. 값의 존재 여부 확인
		* 변수.indexOf(값)
			- 배열에 값이 몇번지에 잇는지 반환, 숫자로, 없으면 -1
		* 변수.includes(값)
			- 배열에 값이 잇는지 없는지를 반환, true,false

	5. 부분 배열 만들기
		* slice(시작 위치?, 끝위치 ?)
			- ?는 없도 된다는 뜻
			- 시작위치~끝위치-1번까지 잘라내서 부분 배열 생성하여 반환 => 원본이 변경안됨
			- 끝위치 생략 시 배열 끝까지, 시작위치 생략 시 배열 전체를 부분 배열 생성
				-변수.slice(3) : 3번지~끝까지 포홤된 부분 배열 생선
				-변수.slice() : 배열과 동일한 배열을 생성

		* 변수.splice(시작위치, 개수?)
			- 시작번지에서 개수만큼 삭제해서 삭제된 값을 반환 => 원본이 바뀜

	6. 배열을 문자열로
		* 변수.join(구분자)
			- 구분자를 이용하여 배열의 값들을 문자열로 만들어서 반환

	*/ 
	console.log('삭제된 배열')
	console.log('arr')
	console.log('앞에 있는 값 제거')
	console.log('제거된 값 : ', arr.shift())
	console.log('제거 후 배열')
	console.log('arr')
	console.log('뒤에 있는 값 제거')
	console.log('제거된 값 : ', arr.pop())
	console.log('제거 후 배열')
	console.log('arr')

	console.log('10이 ㅇㄷ잇냐', arr.indexOf(10))
	console.log('4이 ㅇㄷ잇냐', arr.indexOf(4))

	console.log('10이 ㅇㄷ잇냐', arr.includes(10))
	console.log('4이 ㅇㄷ잇냐', arr.includes(4))

	let arr2 = arr.slice(1);
	console.log('slice로 부분 배열 생성')
	console.log('생성 후 원본')
	console.log('arr')
	console.log('생선된 배열')
	console.log('arr2')

	let arr3 = arr.splice(1);
	console.log('splice로 부분 배열 생성')
	console.log('생성 후 원본')
	console.log('arr')
	console.log('생선된 배열')
	console.log('arr3')

	let arr4 = [1, 2, 3];
	console.log('join 이용 : ', arr4.join("-"))
	/*
	7. 함수가 필요한 기능들
		아래 나오는 기능들은 다음과 같은 함수가 필요
		function 함수명(value, index, array){
		
		}
		value : 배열에서 꺼낸 값 
		index : 해당 value가 배열에 몇 번지인지 나타내는 값
		array : 배열전체
		* 변수.map(함수)
			- 각 요소를 꺼내서 함수에 넣ㄱ도, 함수가 반환한 값들을 이용해서 새로운 배열을 생성하는 기능
			-

	*/ 
	let arrMap = [1, 2, 3, 4];
	//map을 이용해 숫자 배열 arrMap을 문자 배열로 변환
	function toString(value, index, array){
		return value + "";
	}
	let arrMap2 = arrMap.map(toString);
	let arrMap3 = arrMap.map(function (value, index, array){
		return value+ "";
	})
	//화살표 함수르 이용해 map을 동작
	let arrMap4 = arrMap.map((value, index, array)=>value+ "")
	console.log(arrMap)
	console.log('Map을 이용하여 숫자 배열을 문자 배열로 만든 후')
	console.log(arrMap2)
	console.log(arrMap3)
	console.log(arrMap4)

	/*
	변수.filter(함수)
		- 배열에서 꺼낸 값을 함수에 넘겨주어서 함수의 반환값이 true인 값들만 모아 배열을 만들어 주는 기능
	*/ 
	let arrFilter = [1, 3, 2, 4];
	//3보다 작은 값들만 꺼내서 배열을 만듬
	function filter(v, i, arr){
		// if(v < 3){
		// 	return true;
		// }
		// else {
		// 	return false;
		// } 해당 주석 처리한 코드는 아래 코드로 줄일 수 잇음
		return v < 3;
	}
	let arrFilter2 = arrFilter.filter(filter);
	console.log("필터 적용 전 :", arrFilter)
	console.log("필터 적용 후 :", arrFilter2)

	/*
	변수.forEach(함수)
		- 배열에서 값을 꺼내 함수를 실행시킴

		map, filter는 최종적으로 배열이 나옴
		forEach는 배열이 나옴
	*/ 
	let arrFor = [1, 2, 3];
	function log(v, i, arr){
		console.log(`배열[${i}] = ${v}`);
}
	arrFor.forEach(log)
	</script>
