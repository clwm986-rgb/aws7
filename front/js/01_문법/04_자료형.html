<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>자료형 예제</title>
</head>
<body>
	<script>
		/*
		<자료형>
		* 값에따라 자료형이 달라짐

		1. 숫자 : number
			- 정수, 실수 모두 포함

		2.문자열 : string
			- '', "", `` 안에 들어 있는 글자들
			- `` 안에 변수값을 넣을 수 있음
				* `${변수명}`

		3. boolean
			- 참(true) or 거짓(flase)

		4. null
			- 값이 비어 있음

		5. undefined
			- 값이 정해지지 않음

		6. bigint
			- 큰 정수
			- 정수 뒤에 n이 붙임

		7. symbol
			- 고유하고 변경 불가능한 자료형
			- 주로 객체 속성키로 사용

		8. object
			- 배열, 객체, null

		9. funtion
			-함수

		typeof 값
		- 값의 타임을 알려주는 연산자
		*/ 

		//number
		let num1 = 1;
		let num2 = 1.23;
		let num3 = NaN; // Not a number : 숫자 ㄴㄴ
		let num4 = Infinity; //무한대

		//string
		let str1 = "안녕1";
		let str2 = '안녕2';
		let str3 = `안녕3`;

		//''안에 변수명ㅇ을 넣어 문자열 합치는 예제
		let str4 = `${str3}하세여`;

		// ``안쓰고 두 문자열 합치기
		let str5 = str1 + "하세여";

		//boolen
		let isOk = true;

		//null
		let object =null;

		//undefind : 초기화를 하지 않은 상태
		let name;

		let bigNum = 12457891254689n;

		document.write(`123의 타입은? ${typeof123n}<br>`)
		document.write(`123의 타입은? ${typeof '123'}<br>`)

	</script>
</body>
</html>
