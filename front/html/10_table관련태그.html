<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>table 관련 태그</title>
	<!--
	table 작성 시 필수 태그

		table 태그
		 - 테이블을 만들기 우한 태그

		 tr태그
		 - 한 행을 나타내는 태그
		 - 한 행에는 여러 열(th,td) 태그들이 포함

		 td/th 태그
		 - 한열을 나타내는 태그
			td - 주로 첫 행에 사용되며, 가운데 정렬, 굵은 글자
			th - 다음 속성을 이용하여 합칠수 있음
		 	- rowspan : 행 병합
			- colspan : 열 병합
		
		table 작성 시 선택 태그들
			- 테이블 생성
			- 자식 태그로 tr이 옴

		thead 태그
		- 테이블 첫행
		- 대부분 행들 tr이 옴

		tbody 태그
			- 테이블 본문
			- 대부분 행들(tr)이 여기에 속함

		tfoot 태그
		- 테이블 하단
		- 합계와 같이 본문과 다룬 종류의 내용이 필요한 굥우

	tbody, tfoot 작성 시 순서와 관계 없이 화면에는 항상 tbody, tfoot 순으로보임
	-->
</head>
<body>
	<h1>
		<table border="1">
			<tr>
				<th>과목명</th>
				<th>이름</th>
				<th>점수</th>
			</tr>

			<tr>
				<td>a</td>
				<td>임꺽정</td>
				<td>100</td>
			</tr>

			<tr>
				<td>b</td>
				<td>둘리</td>
				<td>90</td>
			</tr>

			<tr>
				<td>c</td>
				<td>홍길동</td>
				<td>80</td>
			</tr>

			<tr>
				<td>평균</td>
				<td>90</td>
			</tr>
		</table>

		<h1>테이블 태그 예제2</h1>
		<table border="1">
			<tfoot>
			<tr>
				<th>과목명</th>
				<th>이름</th>
				<th>점수</th>
			</tr>
			<tfoor>
				<tr>
					<td colspan="2">평균</td>
					<td>90</td>
				</tr>
				</tfoor>
				<tbody>
					<tr>
						<td rowspan="3">gg</td>
				<td>a</td>
				<td>임꺽정</td>
				<td>100</td>
			</tr>

			<tr>
				<td>b</td>
				<td>둘리</td>
				<td>90</td>
			</tr>

			<tr>
				<td>c</td>
				<td>홍길동</td>
				<td>80</td>
			</tr>

				</tbody>
			</thead>
		</table>
	</h1>

				<br><br><br><br>

<h3>사이트 모음</h3>
<table border="1">
	<tbody>
		<tr>
			<td rowspan="2">국내</td>
				
				<th>네이버</th>
				<th>다음</th>
		</tr>


		<tr>
			<td rowspan="2">해외</td>
				
				<th>구글</th>
				<th>깃헙</th>
		</tr>
	</tbody>
				
	



</table>
</body>
</html>
