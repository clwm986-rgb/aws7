<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>목록 태그 예제</title>
</head>
<body>
	<!--
	p.51
	ul 태그
	- 순서가 없는 목록을 지정할 때 사용
	- li 태그와 함께 사용
	- type 속성을 이용하여 마커 
	-->
	<ul>
		<h1>좋아하는 취미 (li태그)</h1>
		<li>게임</li>
		<li>운동</li>
	</ul>
<ul type="square">
	<li>메뉴1</li>
	<li>메뉴2</li>
	<li>메뉴3</li>
</ul>
 <h1>오늘의 할일은? (ol태그)</h1>
 <ol type="i" start="5">
	<li>등원</li>
	<li>점심</li>
 </ol>
 <h1>단어 정의 dl태그</h1>
<dl>
	<dt>하이퍼 텍스트 마크업 랭귀지</dt>
	<dt>자바</dt>
	<dd>프로그래밍 언어</dd>
	<dt>html</dt>
</dl>
 
</body>
</html>
