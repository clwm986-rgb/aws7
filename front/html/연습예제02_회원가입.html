<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=<device-width>, initial-scale=1.0">
	<title>Document</title>
</head>
<body>
	<!--
	회원가입을 위한 화면 구성
	입력정보 : 아이디, 비번, 비번확인, 이메일, 성별-->

<!--내가한거-->
	<h1>회원가입</h1>
	<from action="" method="get">
		<input type="text" name="id" placeholder="아이디"> <br>
		<input type="password" name="pw" placeholder="비밀번호"><br>
		<input type="password" name="email" placeholder="이메일"><br>
		<label>
			<input type="radio" name="gender" value="여성"> 여성
		</label>
		<label>
			<input type="radio" name="gender" value="남성"> 남성
		</label>
		<br>
		<button>회원가입</button>
		</from>

<br><br>

<h1>회원가입</h1>
	<form action="" method="get">
		<div>
		<label for="id">아이디</label>
		<div>
			<input type="text" name="id" placeholder="아이디를 입력하세요." required>
		</div>
		</div>

		<div>
		<label for="id">비밀번호</label>
		<div>
			<input type="password" name="password" placeholder="비밀번호를 입력하세요."required>
		</div>
		</div>
		
		<div>
		<label for="id">비밀번호 확인</label>
		<div>
			<input type="text" name="password2" placeholder="비밀번호를 확인하세요." required>
		</div>
		</div>

		<div>
		<label for="id">이메일</label>
		<div>
			<input type="email" name="email" placeholder="이메일을 입력하세요.">
		</div>
		</div>

		<div>
		<label for="id">이메일</label>
		<div>
			<label>
				<input type="checkbox" name="gender" value="malo"> 남성
			</label>

			<label>
				<input type="checkbox" name="gender" value="female"> 여성
			</label>
		</div>
		</div>
		<button>회원가입</button>
	</form>
</body>
</html>
