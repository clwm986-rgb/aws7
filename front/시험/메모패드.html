<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>메모패드</title>

<style>

body{
    background:#f5f5f5;
}

h1{
    text-align:center;
}

.logo{
    width:40px;
    height:40px;
}

#form{
    width:500px;
    margin:20px auto;
    padding:15px;
    background:white;
    border-radius:8px;
    box-shadow:0 0 5px rgba(0,0,0,0.2);
}

.input-area{
    display:flex;
    gap:10px;
}

.form-control{
    flex:1;
    height:120px;
    resize:none;
    padding:10px;
    font-size:16px;
    border:1px solid #ccc;
    border-radius:8px;
    box-sizing:border-box;
}

.btn{
    width:90px;
    height:120px;
    border:none;
    background:blue;
    color:white;
    font-size:20px;
    border-radius:8px;
    cursor:pointer;
}

.btn:hover{
    background:#3e3eff;
}

.table{
    width:500px;
    margin:20px auto;
    border-collapse:collapse;
    background:white;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 0 5px rgba(0,0,0,0.2);
}

.table td{
    border:none solid gray;
    padding:10px;
}

.table td:nth-child(1){
    width:80%;
}

.table td:nth-child(2){
    width:20%;
    text-align:center;
}

.deleteBtn{
    padding:5px 10px;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

.deleteBtn:hover{
    background:#eee;
}

</style>

</head>
<body>

<h1>
    <span>메모 패드</span>
    <img src="memo.png" alt="메모" class="logo">
</h1>

<form id="form">

    <div class="input-area">

        <textarea
            id="content"
            class="form-control"
            placeholder="메모를 입력하세요..."
        ></textarea>

        <button class="btn">추가</button>

    </div>

</form>

<table class="table">

    <tbody>

    </tbody>

</table>

<script>

let posts = [];

const form = document.querySelector("#form");

form.addEventListener("submit", function(e){

    e.preventDefault();

    const contentEl = document.querySelector("#content");
    const content = contentEl.value.trim();

    if(content==""){
        alert("메모를 입력하세요.");
        return;
    }

    const post = {
        id: Date.now(),
        content: content
    };

    posts.push(post);

    localStorage.setItem("posts", JSON.stringify(posts));

    renderTable();

    contentEl.value = "";

});

function renderTable(){

    const tbody = document.querySelector("tbody");

    tbody.innerHTML = "";

    for(let i = 0; i < posts.length; i++){

        tbody.innerHTML += `
        <tr>
            <td>${posts[i].content}</td>
            <td>
                <button
                    class="deleteBtn"
                    onclick="deletePost(${posts[i].id})">
                    삭제
                </button>
            </td>
        </tr>
        `;

    }

}

function deletePost(id){

    posts = posts.filter(function(post){
        return post.id != id;
    });

    localStorage.setItem("posts", JSON.stringify(posts));

    renderTable();

}

document.addEventListener("DOMContentLoaded", function(){

    const data = localStorage.getItem("posts");

    if(data){
        posts = JSON.parse(data);
    }

    renderTable();

});

</script>

</body>
</html>
